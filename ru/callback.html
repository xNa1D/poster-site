<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster — возврат после авторизации</title>
<link rel="alternate" hreflang="en" href="https://xna1d.com/callback.html">
<link rel="alternate" hreflang="ru" href="https://xna1d.ru/callback.html">
<style>
  :root { --bg:#fbfaf8; --fg:#1b1b19; --muted:#5d5b55; --rule:#e2ded6; --acc:#b3801f; --card:#fff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12140f; --fg:#eceadf; --muted:#a3a093; --rule:#2c2f26; --acc:#e0b055; --card:#191c15; --err:#f2b8b5; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:4rem 16px; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { color:var(--muted); }
  .box { background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:1rem; margin:1.5rem 0; }
  code { font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; color:var(--fg); }
  button { font:inherit; background:var(--acc); color:#12140f; border:0; border-radius:8px; padding:.55rem 1rem; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  .err { color:var(--err); }
  .lang { text-align:right; font-size:.9rem; margin:0 0 1.5rem; }
</style>
</head>
<body>
<main>
  <nav class="lang"><a href="https://xna1d.com/callback.html" hreflang="en" lang="en">English</a></nav>
  <h1 id="title">Возврат после авторизации</h1>
  <p id="hint">Читаю ответ…</p>
  <div class="box"><code id="value">—</code></div>
  <button id="copy" hidden>Скопировать</button>
  <p><a href="./">Poster</a></p>
</main>
<script>
  // Страница ничего не отправляет на сервер: код авторизации только показывается,
  // чтобы его перенести в локальный скрипт. Обмен кода на токен идёт с машины
  // владельца, где лежит client_secret — сюда секрет не попадает никогда.
  const q = new URLSearchParams(location.search);
  const title = document.getElementById('title');
  const hint = document.getElementById('hint');
  const value = document.getElementById('value');
  const copy = document.getElementById('copy');
  const err = q.get('error') || q.get('error_description');
  if (err) {
    title.textContent = 'Авторизация отклонена';
    title.className = 'err';
    hint.textContent = 'Площадка вернула ошибку:';
    value.textContent = err;
  } else if (q.get('code')) {
    title.textContent = 'Авторизовано';
    hint.textContent = 'Скопируйте весь адрес и вставьте его в ожидающий терминал:';
    value.textContent = location.href;
    copy.hidden = false;
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); copy.textContent = 'Скопировано'; }
      catch { copy.textContent = 'Выделите текст выше и скопируйте'; }
    };
  } else {
    hint.textContent = 'Показывать нечего: эту страницу открывает площадка после авторизации аккаунта.';
    value.textContent = '—';
  }
</script>
</body>
</html>
